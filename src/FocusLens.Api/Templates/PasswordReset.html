<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reset your password</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.5; color: #1f2937;">
  <p>Hello {{Email}},</p>
  <p>We received a request to reset your FocusLens password.</p>
  <p>Your password reset token is:</p>
  <p style="font-family: Consolas, monospace; word-break: break-all;">{{ResetToken}}</p>
</body>
</html>
