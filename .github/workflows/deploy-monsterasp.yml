name: Deploy backend to MonsterASP

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Build only, preview Web Deploy changes, or deploy to the live site
        type: choice
        options:
          - build-only
          - preview
          - deploy
        default: build-only
        required: true

permissions:
  contents: read

concurrency:
  group: monsterasp-focuslens-backend
  cancel-in-progress: false

jobs:
  build-and-test:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: ga

      - name: Build and test
        shell: pwsh
        run: |
          dotnet --version
          dotnet test FocusLens.slnx --configuration Release

      - name: Publish backend
        shell: pwsh
        run: |
          dotnet publish src/FocusLens.Api/FocusLens.Api.csproj --configuration Release `
            --output "$env:RUNNER_TEMP/focuslens-publish" -p:UseAppHost=false

      - name: Preview MonsterASP Web Deploy
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        shell: pwsh
        env:
          DEPLOY_MODE: preview
          WEBDEPLOY_SITE: ${{ secrets.WEBDEPLOY_SITE }}
          WEBDEPLOY_URL: ${{ secrets.WEBDEPLOY_URL }}
          WEBDEPLOY_USERNAME: ${{ secrets.WEBDEPLOY_USERNAME }}
          WEBDEPLOY_PASSWORD: ${{ secrets.WEBDEPLOY_PASSWORD }}
        run: ./.github/scripts/sync-monsterasp.ps1

      - name: Save tested publish output
        if: github.event_name == 'push' || inputs.mode == 'deploy'
        uses: actions/upload-artifact@v7
        with:
          name: focuslens-backend
          path: ${{ runner.temp }}/focuslens-publish
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  deploy-production:
    name: Deploy to MonsterASP production
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.mode == 'deploy')
    runs-on: windows-2025
    timeout-minutes: 15
    environment:
      name: monsterasp-production
      url: https://focuslens.runasp.net
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: focuslens-backend
          path: ${{ runner.temp }}/focuslens-publish

      - name: Sync with MonsterASP Web Deploy
        shell: pwsh
        env:
          DEPLOY_MODE: deploy
          WEBDEPLOY_SITE: ${{ secrets.WEBDEPLOY_SITE }}
          WEBDEPLOY_URL: ${{ secrets.WEBDEPLOY_URL }}
          WEBDEPLOY_USERNAME: ${{ secrets.WEBDEPLOY_USERNAME }}
          WEBDEPLOY_PASSWORD: ${{ secrets.WEBDEPLOY_PASSWORD }}
        run: ./.github/scripts/sync-monsterasp.ps1

      - name: Check live health
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            try {
              $health = Invoke-RestMethod 'https://focuslens.runasp.net/health' -TimeoutSec 15
              if ($health.status -eq 'Healthy' -and $health.application -eq 'FocusLens.Api') { exit 0 }
            } catch {
              Write-Warning "Health check not ready (attempt $attempt)."
            }
            Start-Sleep -Seconds 5
          }
          throw 'FocusLens did not return Healthy after deployment.'
